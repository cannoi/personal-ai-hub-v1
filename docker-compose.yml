# Personal AI Hub — public OpenAI-compatible gateway
# Fixed host port 59971 → container 8080
# Third-party apps: http://<PUBLIC_IP>:59971/v1

services:
  personal-ai-hub:
    image: ghcr.io/cannoi/personal-ai-hub-v1:latest
    pull_policy: always
    restart: unless-stopped
    container_name: personal-ai-hub
    hostname: personal-ai-hub
    labels:
      pi.ui.primary: "true"
      pi.ai.gateway: "true"
      pi.ai.openai_path: "/v1"
      pi.ai.public_port: "59971"
    ports:
      - "59971:8080"
    environment:
      AI_HUB_ADMIN_PASSWORD: "${AI_HUB_ADMIN_PASSWORD}"
      # Fixed published port for stable remote / third-party access
      HOST_PORT: "${HOST_PORT:-59971}"
      # Optional full public base, e.g. http://203.0.113.10:59971 (no trailing /v1)
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      AI_HUB_PUBLIC_URL: "${AI_HUB_PUBLIC_URL:-}"
      PORT: "8080"
      SERVICE_NAME: "personal-ai-hub"
      DATA_DIR: "/app/data"
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: "/app/ollama-data"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      AI_HUB_RATE_LIMIT_PER_MIN: "60"
      AI_HUB_MAX_CONCURRENT: "10"
    volumes:
      - personal-ai-hub-data:/app/data
      - personal-ai-ollama-data:/app/ollama-data
    networks:
      default:
        aliases:
          - personal-ai-hub
          - personal_ai_hub
          - ai-hub
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s

volumes:
  personal-ai-hub-data:
  personal-ai-ollama-data:
