title: "Personal AI Hub"
eyebrow: SoloHost AI Gateway
description: "Personal AI Gateway with Local AI and multi-provider routing. Default public port 59971 — change if needed."
footer_hint: "Only enter your Admin access password. AI providers and other settings are managed inside Personal AI Hub."
output_file: .env

fields:
  - name: AI_HUB_ADMIN_PASSWORD
    label: Admin access password
    type: password
    preserve_if_blank: true
    help: "Required to access Hub administration. Use at least 16 characters and keep it private."

  - name: HOST_PORT
    label: Public host port
    type: text
    default: "59971"
    preserve_if_blank: true
    help: "Host port for the Hub (default 59971). Third-party apps use http://YOUR_IP:PORT/v1. Change only if this port is already in use."
