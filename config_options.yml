title: "Personal AI Hub"
eyebrow: SoloHost AI Gateway
description: "Personal AI Gateway with fixed public port 59971. Other apps use http://YOUR_IP:59971/v1"
footer_hint: "Admin password locks the control plane. Set Public base URL if you have a fixed public IP."
output_file: .env

fields:
  - name: AI_HUB_ADMIN_PASSWORD
    label: Admin access password
    type: password
    preserve_if_blank: true
    help: "Required to access Hub administration. Use at least 16 characters and keep it private."

  - name: HOST_PORT
    label: Published host port
    type: text
    default: "59971"
    preserve_if_blank: true
    help: "Fixed port mapped to the Hub (default 59971). Third-party Base URL: http://YOUR_PUBLIC_IP:59971/v1"

  - name: PUBLIC_BASE_URL
    label: Public base URL (recommended)
    type: text
    preserve_if_blank: true
    help: "Full base without /v1, e.g. http://203.0.113.10:59971. Discovery and App Builder should use this + /v1."
